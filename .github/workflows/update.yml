name: Actualización automática Oráculo

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-market:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías
        run: pip install yfinance

      - name: Ejecutar análisis de mercado
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python update.py

      - name: Guardar data.json y alertas
        run: |
          git config user.name "Oraculo Bot"
          git config user.email "bot@oraculo.local"
          git add data.json alerts_sent.json || git add data.json
          git diff --staged --quiet || git commit -m "Actualización automática Oráculo"
          git push
